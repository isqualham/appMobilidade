services:
  front:
    build: .
    image: app-mobilidade
    volumes:
      - .:/app
    ports:
      - "8081:8081"
    networks:
      - my-network
    stdin_open: true
    tty: true
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
networks:
  my-network:
    external: true
